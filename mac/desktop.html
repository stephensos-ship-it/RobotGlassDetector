<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gazebo</title>
  <style>
    body { margin: 0; height: 100vh; display: flex; flex-direction: column;
           background: #292929; color: white; font: 16px monospace; }
    header { display: grid; grid-template-columns: max-content max-content 1fr;
             gap: 4px 24px; padding: 12px; }
    iframe { flex: 1; min-height: 0; width: 100%; border: 0; }
  </style>
</head>
<body>
  <header aria-label="CPU usage and reaction times">
    <span>Total system:</span><span id="system"></span><span></span>
    <span>TIAGo 1 pipeline:</span><span id="tiago1"></span><span id="tiago1-reaction"></span>
    <span>TIAGo 2 pipeline:</span><span id="tiago2"></span><span id="tiago2-reaction"></span>
  </header>
  <iframe id="desktop" title="Gazebo remote desktop" allow="fullscreen"></iframe>
  <script>
    // Keep the noVNC password and display options from the link printed by Docker.
    const desktop = new URL('vnc.html', location.href);
    desktop.search = location.search;
    document.getElementById('desktop').src = desktop.href;

    const fields = ['system', 'tiago1', 'tiago2', 'tiago1-reaction', 'tiago2-reaction'];
    function unavailable() {
      fields.forEach(name => document.getElementById(name).textContent = '');
    }

    // Reaction: from the first laser scan showing the obstacle to the stop command, in
    // simulated time and in real (wall-clock) time. The gap is measured from the laser.
    function describe(reaction) {
      if (reaction == null) return '';
      if (reaction.reaction_sim == null) return reaction.driving ? 'driving' : '';
      const seconds = value => `${value.toFixed(2)} s`;
      const timing = `reaction ${seconds(reaction.reaction_sim)} sim, ` +
                     `${seconds(reaction.reaction_real)} real`;
      if (reaction.driving) return `${timing} · driving again`;
      return reaction.rest_gap == null ? `${timing} · stopping`
        : `${timing} · stopped ${reaction.rest_gap.toFixed(2)} m from the box`;
    }

    async function refresh() {
      try {
        const response = await fetch('cpu-usage.json', { cache: 'no-store' });
        if (!response.ok) throw new Error('No CPU sample');
        const sample = await response.json();
        if (Date.now() / 1000 - sample.time > 4) {
          unavailable();
          return;
        }
        const percent = value => `${value.toFixed(2)}%`;
        document.getElementById('system').textContent = percent(sample.system);
        for (const name of ['tiago1', 'tiago2']) {
          const value = sample.robots[name];
          document.getElementById(name).textContent = value == null ? '' : percent(value);
          document.getElementById(`${name}-reaction`).textContent =
            describe((sample.reactions || {})[name]);
        }
      } catch {
        unavailable();
      }
    }
    refresh();
    setInterval(refresh, 1000);
  </script>
</body>
</html>
